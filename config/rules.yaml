# Live copy lives on the Render disk and is editable from the dashboard. This file seeds it.
# Searches use Upwork's search syntax: quotes for phrases, OR between alternatives.

searches:
  - '(excel OR "google sheets" OR "ms access" OR "microsoft access" OR vba) AND (quote OR quoting OR invoice OR invoicing OR "work order" OR estimating OR estimator)'
  - '"google sheets" AND (automation OR "apps script" OR script OR macro OR menu OR database)'
  - '"access database" OR "microsoft access" OR "ms access"'
  - '"workflow automation" OR "business automation" OR "ai automation" OR "process automation"'
  - '"estimating system" OR "cost estimating" OR "construction estimating" OR bluebeam OR "pricing database"'
  - '"kpi dashboard" OR "operational reporting" OR "performance management" OR "process improvement" OR "business intelligence"'
  - 'servicetitan OR "practice analytics" OR "healthcare analytics" OR "revenue cycle"'

poll_seconds: 75               # 45 minimum; ~1,150 requests/day per search, Upwork allows 40,000
score_threshold: 70            # only jobs scoring at or above this get a drafted proposal
max_drafts_per_day: 40         # hard cap on Sonnet drafts (cost guard)
digest_hour: 8                 # local time (America/Chicago)
followup_days: 5               # ask about the outcome this many days after you send

filters:
  payment_verified: true
  min_hourly: 50               # hourly floor: skip if the client's range tops out below this
  min_fixed_budget: 500        # skip fixed-price jobs below this (unstated budgets pass)
  max_proposals: 15
  min_client_hires: 1          # a client passes with EITHER this many hires...
  min_client_spent: 1000       # ...OR this much total spend
  min_client_rating: 4.0
  exclude_countries: []
  include_terms: []            # empty = no include requirement
  exclude_terms:
    - unpaid test
    - equity only
    - wordpress theme
    - data entry
