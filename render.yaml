services:
  - type: web
    name: upwork-autopilot
    runtime: python
    plan: starter            # $7/mo, always on
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1              # $0.25/mo
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: America/Chicago
      # Secrets: values are pasted by you in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: UPWORK_CLIENT_ID
        sync: false
      - key: UPWORK_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: INGEST_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false          # e.g. https://upwork-autopilot.onrender.com
