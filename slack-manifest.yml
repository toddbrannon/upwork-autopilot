# Paste into api.slack.com/apps → Create New App → From an app manifest.
# If your Render URL differs from upwork-autopilot-qimn.onrender.com, change the two URLs below.
display_information:
  name: Upwork Autopilot
  description: New Upwork jobs, scored and drafted, waiting for your approval.
  background_color: "#14532d"
features:
  bot_user:
    display_name: Upwork Autopilot
    always_online: true
  slash_commands:
    - command: /autopilot
      url: https://upwork-autopilot-qimn.onrender.com/slack/command
      description: Status, digest, threshold, pause, resume
      usage_hint: status | digest | threshold 75 | pause | resume
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
settings:
  interactivity:
    is_enabled: true
    request_url: https://upwork-autopilot-qimn.onrender.com/slack/interact
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
